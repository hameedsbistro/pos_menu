<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hamid Beast - Cashier Panel</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 font-sans overflow-hidden">

    <div class="flex h-screen w-screen">
        
        <!-- Main Panel -->
        <div class="flex-1 flex flex-col h-full overflow-hidden">
            
            <!-- Header Panel -->
            <header class="bg-white border-b shadow-sm px-6 py-3 flex justify-between items-center">
                <div class="flex items-center space-x-4">
                    <div class="flex flex-col">
                        <h1 class="font-bold text-lg text-gray-900 leading-tight">Hamid Beast</h1>
                        <div class="flex items-center space-x-2 mt-0.5">
                            <span class="text-xs text-gray-500 font-medium">Welcome:</span>
                            <span class="text-xs font-bold text-emerald-700">Prokash Rakshit</span>
                        </div>
                    </div>
                </div>

                <div class="flex items-center space-x-3">
                    <button onclick="openNotificationModal()" class="bg-gray-100 hover:bg-gray-200 text-gray-700 px-3 py-2 rounded-xl text-xs font-medium relative flex items-center gap-1">
                        Notifications
                        <span id="notificationBadge" class="bg-red-600 text-white text-[10px] font-bold px-1.5 py-0.2 rounded-full hidden">0</span>
                    </button>
                    <button onclick="refreshCashierSystem()" class="bg-gray-100 hover:bg-gray-200 text-gray-700 px-3 py-2 rounded-xl text-xs font-medium">Refresh</button>
                </div>
            </header>

            <!-- Main Panel (Current Orders in Sketch Grid Card View) -->
            <main class="flex-1 p-6 bg-gray-50 overflow-y-auto">
                <div class="mb-4">
                    <h2 class="text-xl font-bold text-gray-800">Current Orders</h2>
                </div>
                <!-- Grid Container matching your sketch layout -->
                <div id="pendingOrdersContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5"></div>
            </main>
        </div>

        <!-- Right Sidebar Panel -->
        <aside class="w-56 bg-gray-900 text-white flex flex-col p-4 justify-start space-y-3 shadow-xl flex-shrink-0">
            <div class="text-xs font-bold text-gray-400 mb-2 uppercase tracking-wider">Quick Actions</div>
            <button class="bg-emerald-700 hover:bg-emerald-800 text-white py-3 px-4 rounded-xl font-bold text-sm shadow transition text-center">NEW ORDER</button>
            <button class="bg-gray-800 hover:bg-gray-700 text-white py-3 px-4 rounded-xl font-bold text-sm shadow transition text-center">INVOICE LIST</button>
            <button class="bg-gray-800 hover:bg-gray-700 text-white py-3 px-4 rounded-xl font-bold text-sm shadow transition text-center">LAST RECEIPT</button>
        </aside>

    </div>

    <!-- Notification Modal -->
    <div id="notificationModal" class="fixed inset-0 bg-black bg-opacity-60 flex items-center justify-center z-50 hidden">
        <div class="bg-white p-6 rounded-2xl max-w-xl w-full shadow-2xl relative mx-4 max-h-[80vh] flex flex-col">
            <button onclick="closeNotificationModal()" class="absolute top-4 right-4 text-gray-500 hover:text-gray-700 font-bold text-lg">&times;</button>
            <h3 class="font-bold text-xl text-gray-800 mb-4">Customer Order Notifications</h3>
            <div class="flex-1 overflow-y-auto space-y-3 pr-1" id="incomingOrdersList"></div>
        </div>
    </div>

    <!-- Order Detail & Modification Modal -->
    <div id="orderDetailModal" class="fixed inset-0 bg-black bg-opacity-60 flex items-center justify-center z-50 hidden">
        <div class="bg-white p-6 rounded-2xl max-w-2xl w-full shadow-2xl relative mx-4 max-h-[90vh] flex flex-col">
            <button onclick="closeOrderModal()" class="absolute top-4 right-4 text-gray-500 font-bold text-lg">&times;</button>
            <h3 id="modalOrderTitle" class="font-bold text-xl text-gray-800 mb-1">Order Details</h3>
            <p id="modalOrderMeta" class="text-xs text-gray-500 mb-4"></p>
            <div class="border rounded-xl p-3 mb-4 max-h-48 overflow-y-auto bg-gray-50 space-y-2" id="modalOrderItemsList"></div>
            <div class="flex justify-end space-x-3 mt-4 pt-3 border-t">
                <button onclick="closeOrderModal()" class="bg-gray-200 text-gray-700 px-4 py-2 rounded-xl text-sm font-medium">Close</button>
                <button id="modalAcceptBtn" onclick="" class="bg-emerald-600 text-white px-4 py-2 rounded-xl text-sm font-medium hidden">Accept Order</button>
            </div>
        </div>
    </div>

    <!-- Payment Modal -->
    <div id="paymentModal" class="fixed inset-0 bg-black bg-opacity-60 flex items-center justify-center z-50 hidden">
        <div class="bg-white p-6 rounded-2xl max-w-md w-full shadow-2xl relative mx-4">
            <button onclick="closePaymentModal()" class="absolute top-4 right-4 text-gray-500 font-bold text-lg">&times;</button>
            <h3 class="font-bold text-xl text-gray-800 mb-1">Complete Payment</h3>
            <p id="paymentOrderInfo" class="text-xs text-gray-500 mb-4"></p>
            <div class="bg-gray-50 p-4 rounded-xl border mb-4">
                <div class="flex justify-between mb-2">
                    <span class="text-gray-600">Total Amount:</span>
                    <span id="paymentTotalAmount" class="font-bold text-lg text-emerald-600">RM0.00</span>
                </div>
            </div>
            <div class="grid grid-cols-2 gap-3 mb-4">
                <button onclick="completePayment('Cash')" class="border-2 border-emerald-500 bg-emerald-50 text-emerald-700 py-3 rounded-xl font-semibold text-sm">Cash</button>
                <button onclick="completePayment('QR / Online')" class="border-2 border-blue-500 bg-blue-50 text-blue-700 py-3 rounded-xl font-semibold text-sm">QR / Online</button>
            </div>
        </div>
    </div>

    <script>
        // --- Supabase Credentials ---
        const SUPABASE_URL = 'YOUR_SUPABASE_URL';
        const SUPABASE_KEY = 'YOUR_SUPABASE_ANON_KEY';
        
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let currentActiveOrderId = null;
        let activeOrderData = null;

        // Load Pending Orders in Card Grid Layout (As per your sketch)
        async function loadPendingOrders() {
            const container = document.getElementById('pendingOrdersContainer');
            if(!container) return;
            container.innerHTML = '<p class="text-gray-500 text-sm col-span-full">Loading orders...</p>';

            const { data, error } = await _supabase
                .from('orders')
                .select('*')
                .eq('status', 'Pending')
                .order('created_at', { ascending: false });

            if(error) {
                container.innerHTML = '<p class="text-red-500 text-sm col-span-full">Failed to load orders.</p>';
                return;
            }

            if(!data || data.length === 0) {
                container.innerHTML = '<p class="text-gray-500 text-sm col-span-full">No active current orders.</p>';
                return;
            }

            container.innerHTML = data.map(order => `
                <div class="bg-white border border-gray-200 p-4 rounded-2xl shadow-sm flex flex-col justify-between space-y-4">
                    <div class="space-y-1.5 text-xs text-gray-700">
                        <div class="flex justify-between items-center pb-2 border-b">
                            <span class="font-bold text-gray-900 text-sm">Order #${order.id}</span>
                            <span class="bg-amber-100 text-amber-800 text-[10px] px-2 py-0.5 rounded-full font-semibold">Table: ${order.table_id || 'N/A'}</span>
                        </div>
                        <div class="flex justify-between"><span class="text-gray-500">Order Type:</span> <span class="font-medium">${order.order_type || 'Dine In'}</span></div>
                        <div class="flex justify-between"><span class="text-gray-500">Order Time:</span> <span class="font-medium">${new Date(order.created_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}</span></div>
                        <div class="flex justify-between"><span class="text-gray-500">Status:</span> <span class="font-semibold text-amber-600">${order.status}</span></div>
                        <div class="flex justify-between pt-1 border-t font-bold text-sm"><span class="text-gray-800">Total:</span> <span class="text-emerald-600">RM${Number(order.total_amount || 0).toFixed(2)}</span></div>
                    </div>

                    <!-- Sketch matching Open and Payment buttons -->
                    <div class="grid grid-cols-2 gap-2 pt-2 border-t">
                        <button onclick='openOrderDetails(${JSON.stringify(order)})' class="bg-gray-800 hover:bg-gray-900 text-white py-2 rounded-xl text-xs font-semibold shadow transition text-center">Open</button>
                        <button onclick='openPaymentModalFromList(${JSON.stringify(order)})' class="bg-emerald-600 hover:bg-emerald-700 text-white py-2 rounded-xl text-xs font-semibold shadow transition text-center">Payment</button>
                    </div>
                </div>
            `).join('');
            
            fetchIncomingOrdersCount();
        }

        async function fetchIncomingOrdersCount() {
            const { data } = await _supabase.from('orders').select('id').eq('status', 'Pending Customer Order');
            const badge = document.getElementById('notificationBadge');
            if (data && data.length > 0) {
                badge.innerText = data.length;
                badge.classList.remove('hidden');
            } else {
                badge.classList.add('hidden');
            }
        }

        async function openNotificationModal() {
            document.getElementById('notificationModal').classList.remove('hidden');
            const container = document.getElementById('incomingOrdersList');
            container.innerHTML = '<p class="text-gray-500 text-sm">Loading...</p>';

            const { data } = await _supabase.from('orders').select('*').eq('status', 'Pending Customer Order').order('created_at', { ascending: false });
            if (!data || data.length === 0) {
                container.innerHTML = '<p class="text-gray-500 text-sm">No new customer orders.</p>';
                return;
            }

            container.innerHTML = data.map(order => `
                <div class="border p-3 rounded-xl bg-gray-50 flex justify-between items-center text-xs">
                    <div>
                        <span class="font-bold text-gray-900">Order #${order.id}</span>
                        <p class="text-gray-600">Table: ${order.table_id || 'N/A'} | RM${Number(order.total_amount || 0).toFixed(2)}</p>
                    </div>
                    <div class="flex gap-1">
                        <button onclick='openOrderDetails(${JSON.stringify(order)}, true)' class="bg-gray-800 text-white px-3 py-1 rounded">Open</button>
                        <button onclick="acceptNotificationOrder(${order.id})" class="bg-emerald-600 text-white px-3 py-1 rounded">Accept</button>
                    </div>
                </div>
            `).join('');
        }
        function closeNotificationModal() { document.getElementById('notificationModal').classList.add('hidden'); }

        async function acceptNotificationOrder(orderId) {
            await _supabase.from('orders').update({ status: 'Pending' }).eq('id', orderId);
            closeNotificationModal();
            loadPendingOrders();
        }

        async function openOrderDetails(order, isNotif = false) {
            currentActiveOrderId = order.id;
            document.getElementById('modalOrderTitle').innerText = `Order ID: #${order.id}`;
            document.getElementById('modalOrderMeta').innerText = `Table: ${order.table_id || 'N/A'} | Type: ${order.order_type || 'Dine In'}`;
            
            const acceptBtn = document.getElementById('modalAcceptBtn');
            if (isNotif) {
                acceptBtn.classList.remove('hidden');
                acceptBtn.setAttribute('onclick', `acceptNotificationOrder(${order.id}); closeOrderModal();`);
            } else {
                acceptBtn.classList.add('hidden');
            }

            const { data: items } = await _supabase.from('order_items').select('*').eq('order_id', order.id);
            const itemsContainer = document.getElementById('modalOrderItemsList');
            itemsContainer.innerHTML = items ? items.map(i => `<div class="flex justify-between text-xs py-1"><span>${i.item_name} (x${i.quantity})</span><span>RM${(i.price * i.quantity).toFixed(2)}</span></div>`).join('') : '';

            document.getElementById('orderDetailModal').classList.remove('hidden');
        }
        function closeOrderModal() { document.getElementById('orderDetailModal').classList.add('hidden'); }

        function openPaymentModalFromList(order) {
            currentActiveOrderId = order.id;
            document.getElementById('paymentOrderInfo').innerText = `Order ID: #${order.id} | Table: ${order.table_id || 'N/A'}`;
            document.getElementById('paymentTotalAmount').innerText = `RM${Number(order.total_amount || 0).toFixed(2)}`;
            document.getElementById('paymentModal').classList.remove('hidden');
        }
        function closePaymentModal() { document.getElementById('paymentModal').classList.add('hidden'); }

        async function completePayment(method) {
            await _supabase.from('orders').update({ status: 'Completed', payment_status: 'Paid' }).eq('id', currentActiveOrderId);
            closePaymentModal();
            closeOrderModal();
            loadPendingOrders();
        }

        function refreshCashierSystem() { loadPendingOrders(); }

        window.addEventListener('DOMContentLoaded', () => {
            loadPendingOrders();
        });
    </script>
</body>
</html>
