<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hameeds Bistro - Cashier Login & Panel</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- অতিরিক্ত স্টাইল: পপআপের লেয়ার উপরে রাখার জন্য -->
    <style>
        .z-9999 { z-index: 9999 !important; }
    </style>
</head>
<body class="bg-gray-100 font-sans overflow-hidden">

    <!-- ==================== LOGIN SECTION ==================== -->
    <div id="loginSection" class="flex h-screen w-screen items-center justify-center bg-gray-900 absolute inset-0 z-50">
        <div class="bg-white p-8 rounded-2xl max-w-md w-full shadow-2xl relative mx-4">
            <div class="text-center mb-6">
                <img src="images/logo.png" alt="Logo" class="w-16 h-16 rounded-full object-cover border-2 border-emerald-600 mx-auto mb-2" onerror="this.src='https://via.placeholder.com/60'">
                <h1 class="font-bold text-2xl text-gray-900">Hameeds Bistro</h1>
                <p class="text-xs text-gray-500 mt-1">Cashier Panel Login</p>
            </div>

            <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-medium text-gray-700 mb-1">Email Address</label>
                    <input type="email" id="loginEmail" required class="w-full border px-3 py-2 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500" placeholder="cashier@bistro.com">
                </div>
                <div>
                    <label class="block text-xs font-medium text-gray-700 mb-1">Password</label>
                    <input type="password" id="loginPassword" required class="w-full border px-3 py-2 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500" placeholder="••••••••">
                </div>
                <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white py-2.5 rounded-xl text-sm font-semibold shadow transition">
                    Login to Panel
                </button>
            </form>
            <div id="loginError" class="text-red-500 text-xs text-center mt-3 hidden"></div>
        </div>
    </div>

    <!-- ==================== MAIN CASHIER PANEL ==================== -->
    <div id="mainPanel" class="flex h-screen w-screen hidden">
        
        <!-- Main Panel (Current Orders + Header) -->
        <div class="flex-1 flex flex-col h-full overflow-hidden">
            
            <!-- Header Panel -->
            <header class="bg-white border-b shadow-sm px-6 py-3 flex justify-between items-center">
                
                <!-- Left Side: Logo, Name, Welcome & Role -->
                <div class="flex items-center space-x-4">
                    <img src="images/logo.png" alt="Logo" class="w-12 h-12 rounded-full object-cover border-2 border-emerald-600" onerror="this.src='https://via.placeholder.com/50'">
                    
                    <div class="flex flex-col">
                        <h1 class="font-bold text-lg text-gray-900 leading-tight">Hameeds Bistro</h1>
                        <div class="flex items-center space-x-2 mt-0.5">
                            <span class="text-xs text-gray-500 font-medium">Welcome:</span>
                            <span id="cashierName" class="text-xs font-bold text-emerald-700">Cashier</span>
                        </div>
                        <div class="flex items-center space-x-2 mt-0.5">
                            <span class="text-xs text-gray-500 font-medium">Role:</span>
                            <span id="cashierRole" class="text-xs uppercase font-bold text-blue-600">Cashier</span>
                        </div>
                    </div>
                </div>

                <!-- Right Side Buttons -->
                <div class="flex items-center space-x-2">
                    <div class="flex flex-col space-y-1">
                        <button id="checkInBtn" onclick="doCheckIn()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-3 py-1 rounded-lg text-xs font-medium shadow-sm transition text-center">
                            Check-In
                        </button>
                        <button id="checkOutBtn" onclick="doCheckOut()" class="bg-red-500 hover:bg-red-600 text-white px-3 py-1 rounded-lg text-xs font-medium shadow-sm transition text-center">
                            Check-Out
                        </button>
                    </div>

                    <!-- Notification Button -->
                    <div class="relative">
                        <button onclick="openNotificationModal()" class="bg-gray-100 hover:bg-gray-200 text-gray-700 p-2.5 rounded-xl text-sm font-medium shadow-sm transition flex items-center justify-center relative" title="New Order Notifications">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" />
                            </svg>
                            <span id="notificationBadge" class="absolute -top-1 -right-1 bg-red-600 text-white text-[10px] font-bold w-5 h-5 rounded-full flex items-center justify-center border-2 border-white hidden">0</span>
                        </button>
                    </div>

                    <!-- Refresh Button -->
                    <button onclick="refreshCashierSystem()" class="bg-gray-100 hover:bg-gray-200 text-gray-700 p-2.5 rounded-xl text-sm font-medium shadow-sm transition flex items-center justify-center" title="Refresh System">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                        </svg>
                    </button>

                    <!-- Logout Button -->
                    <button onclick="handleLogout()" class="bg-red-600 hover:bg-red-700 text-white px-3 py-2 rounded-xl text-xs font-medium shadow-sm transition flex items-center gap-1">
                        Logout
                    </button>
                </div>
            </header>

            <!-- Main Panel (Current Orders) -->
            <main class="flex-1 p-6 bg-gray-50 overflow-y-auto">
                <div class="mb-4">
                    <h2 class="text-xl font-bold text-gray-800">Current Orders</h2>
                </div>
                <div id="pendingOrdersContainer" class="space-y-3"></div>
            </main>
        </div>

        <!-- Right Sidebar Panel -->
        <aside class="w-56 bg-gray-900 text-white flex flex-col p-4 justify-start space-y-3 shadow-xl flex-shrink-0">
            <div class="text-xs font-bold text-gray-400 mb-2 uppercase tracking-wider">Quick Actions</div>
            <button class="bg-emerald-700 hover:bg-emerald-800 text-white py-3 px-4 rounded-xl font-bold text-sm shadow transition text-center">NEW ORDER</button>
            <button class="bg-gray-800 hover:bg-gray-700 text-white py-3 px-4 rounded-xl font-bold text-sm shadow transition text-center">INVOICE LIST</button>
            <button class="bg-gray-800 hover:bg-gray-700 text-white py-3 px-4 rounded-xl font-bold text-sm shadow transition text-center">LAST RECEIPT</button>
        </aside>

    </div>

    <!-- Modals (Order Details মডালে z-9999 ব্যবহার করা হয়েছে) -->
    <div id="orderDetailModal" class="fixed inset-0 bg-black bg-opacity-60 flex items-center justify-center z-9999 hidden">
        <div class="bg-white p-6 rounded-2xl max-w-2xl w-full shadow-2xl relative mx-4 max-h-[90vh] flex flex-col">
            <button onclick="closeOrderModal()" class="absolute top-4 right-4 bg-gray-200 hover:bg-gray-300 text-gray-700 w-8 h-8 rounded-full font-bold flex items-center justify-center text-lg">&times;</button>
            <h3 id="modalOrderTitle" class="font-bold text-xl text-gray-800 mb-1">Order Details</h3>
            <p id="modalOrderMeta" class="text-xs text-gray-500 mb-4"></p>
            
            <!-- আইটেম লিস্ট এবং রিমুভ বাটন -->
            <div class="border rounded-xl p-3 mb-4 max-h-40 overflow-y-auto bg-gray-50 space-y-2" id="modalOrderItemsList"></div>
            
            <div class="border-t pt-3 flex-1 flex flex-col">
                <h4 class="font-semibold text-gray-700 text-sm mb-2">Add Extra Item from Menu:</h4>
                <div class="flex gap-2 mb-3">
                    <select id="extraMenuItemSelect" class="flex-1 border px-3 py-2 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500"></select>
                    <button onclick="addExtraItemToOrder()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-xl text-sm font-medium">Add</button>
                </div>
            </div>
            <div class="flex justify-end space-x-3 mt-4 pt-3 border-t">
                <button onclick="closeOrderModal()" class="bg-gray-200 text-gray-700 px-5 py-2 rounded-xl text-sm font-medium">Close</button>
                <button onclick="proceedToPaymentFromModal()" class="bg-blue-600 hover:bg-blue-700 text-white px-5 py-2 rounded-xl text-sm font-medium">Proceed to Payment</button>
            </div>
        </div>
    </div>

    <div id="paymentModal" class="fixed inset-0 bg-black bg-opacity-60 flex items-center justify-center z-50 hidden">
        <div class="bg-white p-6 rounded-2xl max-w-md w-full shadow-2xl relative mx-4">
            <button onclick="closePaymentModal()" class="absolute top-4 right-4 bg-gray-200 hover:bg-gray-300 text-gray-700 w-8 h-8 rounded-full font-bold flex items-center justify-center text-lg">&times;</button>
            <h3 class="font-bold text-xl text-gray-800 mb-1">Complete Payment</h3>
            <p id="paymentOrderInfo" class="text-xs text-gray-500 mb-4"></p>
            <div class="bg-gray-50 p-4 rounded-xl border mb-4">
                <div class="flex justify-between mb-2">
                    <span class="text-gray-600">Total Amount:</span>
                    <span id="paymentTotalAmount" class="font-bold text-lg text-emerald-600">RM0.00</span>
                </div>
            </div>
            <div class="space-y-3 mb-5">
                <label class="block text-sm font-medium text-gray-700">Select Payment Method:</label>
                <div class="grid grid-cols-2 gap-3">
                    <button onclick="completePayment('Cash')" class="border-2 border-emerald-500 bg-emerald-50 text-emerald-700 py-3 rounded-xl font-semibold text-sm hover:bg-emerald-100 transition">Cash</button>
                    <button onclick="completePayment('QR / Online')" class="border-2 border-blue-500 bg-blue-50 text-blue-700 py-3 rounded-xl font-semibold text-sm hover:bg-blue-100 transition">QR / Online</button>
                </div>
            </div>
            <button onclick="closePaymentModal()" class="w-full bg-gray-200 text-gray-700 py-2 rounded-xl text-sm font-medium">Cancel</button>
        </div>
    </div>

    <div id="notificationModal" class="fixed inset-0 bg-black bg-opacity-60 flex items-center justify-center z-50 hidden">
        <div class="bg-white p-6 rounded-2xl max-w-xl w-full shadow-2xl relative mx-4 max-h-[85vh] flex flex-col">
            <button onclick="closeNotificationModal()" class="absolute top-4 right-4 bg-gray-200 hover:bg-gray-300 text-gray-700 w-8 h-8 rounded-full font-bold flex items-center justify-center text-lg">&times;</button>
            <h3 class="font-bold text-xl text-gray-800 mb-2">Customer Order Notifications</h3>
            <p class="text-xs text-gray-500 mb-4">Review incoming customer orders.</p>
            <div class="flex-1 overflow-y-auto space-y-4 pr-1" id="incomingOrdersList"></div>
            <div class="mt-4 pt-3 border-t flex justify-end">
                <button onclick="closeNotificationModal()" class="bg-gray-200 text-gray-700 px-5 py-2 rounded-xl text-sm font-medium">Close</button>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://tbvcaolnufayuvrqicpd.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRidmNhb2xudWZheXV2cnFpY3BkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYyMTI4MzYsImV4cCI6MjEwMTc4ODgzNn0.Cn2L569yd9qG8t1fXWN9rnwZ03Yott5P-doedUv1ItU';
        
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let currentActiveOrderId = null;
        let activeOrderData = null;

        async function handleLogin(event) {
            event.preventDefault();
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            const errorDiv = document.getElementById('loginError');

            errorDiv.classList.add('hidden');

            const { data, error } = await _supabase.auth.signInWithPassword({
                email: email,
                password: password
            });

            if (error) {
                errorDiv.innerText = error.message;
                errorDiv.classList.remove('hidden');
                return;
            }

            checkAuthSession();
        }

        async function handleLogout() {
            await _supabase.auth.signOut();
            document.getElementById('mainPanel').classList.add('hidden');
            document.getElementById('loginSection').classList.remove('hidden');
        }

        async function checkAuthSession() {
            const { data: { session } } = await _supabase.auth.getSession();
            
            if (session) {
                document.getElementById('loginSection').classList.add('hidden');
                document.getElementById('mainPanel').classList.remove('hidden');
                
                if(session.user && session.user.email) {
                    document.getElementById('cashierName').innerText = session.user.email.split('@')[0];
                }

                loadPendingOrders();
                fetchIncomingOrders();
                setupRealtimeSubscription();
            } else {
                document.getElementById('mainPanel').classList.add('hidden');
                document.getElementById('loginSection').classList.remove('hidden');
            }
        }

        async function loadPendingOrders() {
            const container = document.getElementById('pendingOrdersContainer');
            container.innerHTML = '<p class="text-gray-500 text-sm">Loading current orders...</p>';

            const { data, error } = await _supabase
                .from('orders')
                .select('*')
                .eq('status', 'pending')
                .order('created_at', { ascending: false });

            if(error) {
                container.innerHTML = '<p class="text-red-500 text-sm">Failed to load orders.</p>';
                return;
            }

            if(!data || data.length === 0) {
                container.innerHTML = '<p class="text-gray-500 text-sm">No pending orders available.</p>';
                return;
            }

            container.innerHTML = data.map(order => `
                <div class="bg-white border border-gray-200 p-4 rounded-2xl shadow-sm flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                    <div>
                        <div class="flex items-center gap-2 mb-1">
                            <span class="font-bold text-gray-800 text-base">Order ID: #${order.id}</span>
                            <span class="bg-amber-100 text-amber-800 text-[10px] px-2 py-0.5 rounded-full font-semibold">${order.status}</span>
                        </div>
                        <p class="text-xs text-gray-600">Table / Location: <span class="font-semibold text-gray-800">${order.table_id || 'N/A'}</span></p>
                    </div>
                    <div class="flex items-center gap-3">
                        <span class="font-bold text-base text-emerald-600 mr-2">RM${Number(order.total_amount || 0).toFixed(2)}</span>
                        <button onclick='openOrderDetails(${JSON.stringify(order)})' class="bg-gray-800 hover:bg-gray-900 text-white px-3.5 py-1.5 rounded-xl text-xs font-medium">Open</button>
                        <button onclick='openPaymentModalFromList(${JSON.stringify(order)})' class="bg-emerald-600 hover:bg-emerald-700 text-white px-3.5 py-1.5 rounded-xl text-xs font-medium">Payment</button>
                    </div>
                </div>
            `).join('');
        }

        async function openOrderDetails(order) {
            currentActiveOrderId = order.id;
            activeOrderData = order;
            document.getElementById('modalOrderTitle').innerText = `Order ID: #${order.id}`;
            document.getElementById('modalOrderMeta').innerText = `Table: ${order.table_id || 'N/A'}`;
            
            await renderModalItems(order.id);
            loadMenuForDropdown();
            document.getElementById('orderDetailModal').classList.remove('hidden');
        }

        // এই ফাংশনটি কোডের ভেতর যেখানে আছে, সেখানে এটি বসান


        async function renderModalItems(orderId) {
    const itemsContainer = document.getElementById('modalOrderItemsList');
    itemsContainer.innerHTML = '<p class="text-xs text-gray-500">Loading items...</p>';

    // order_items টেবিলের সাথে সঠিক 'menu_items' টেবিল এবং 'name_en' কলাম জয়েন করা হলো
    const { data: items, error } = await _supabase
        .from('order_items')
        .select(`
            id,
            order_id,
            quantity,
            price,
            menu_item_id,
            menu_items ( name_en )
        `)
        .eq('order_id', orderId);
    
    if (error || !items || items.length === 0) {
        itemsContainer.innerHTML = '<p class="text-xs text-gray-500">No items found in this order.</p>';
        return;
    }

    itemsContainer.innerHTML = items.map(item => {
        // menu_items টেবিল থেকে name_en ফেচ করা হচ্ছে
        const itemName = item.menu_items?.name_en || `Item ID: ${item.menu_item_id}`;

        return `
            <div class="flex justify-between items-center py-1.5 border-b text-xs">
                <div>
                    <span class="font-medium text-gray-800">${itemName}</span>
                    <span class="text-gray-500 ml-2">x${item.quantity} (RM${(item.price * item.quantity).toFixed(2)})</span>
                </div>
                <button onclick="removeItemFromOrder(${item.id}, ${orderId})" class="text-red-600 hover:text-red-800 font-bold px-2 py-0.5 bg-red-50 rounded text-xs">✕ Remove</button>
            </div>
        `;
    }).join('');
}
        

            async function removeItemFromOrder(itemId, orderId) {
            const { error } = await _supabase.from('order_items').delete().eq('id', itemId);
            if (!error) {
                await renderModalItems(orderId);
            } else {
                alert('Failed to remove item.');
            }
        }

        function closeOrderModal() { 
            document.getElementById('orderDetailModal').classList.add('hidden'); 
        }

        async function loadMenuForDropdown() {
            const select = document.getElementById('extraMenuItemSelect');
            const { data } = await _supabase.from('menu_items').select('*');
            if(data) {
                select.innerHTML = data.map(m => `<option value="${m.id}" data-price="${m.price}" data-name="${m.name}">${m.name} - RM${m.price}</option>`).join('');
            }
        }

        async function addExtraItemToOrder() {
            const select = document.getElementById('extraMenuItemSelect');
            const opt = select.options[select.selectedIndex];
            if(!opt) return;

            await _supabase.from('order_items').insert([{
                order_id: currentActiveOrderId,
                menu_item_id: opt.value,
                item_name: opt.getAttribute('data-name'),
                price: parseFloat(opt.getAttribute('data-price')),
                quantity: 1
            }]);
            
            await renderModalItems(currentActiveOrderId);
        }

        function openPaymentModalFromList(order) {
            currentActiveOrderId = order.id;
            document.getElementById('paymentOrderInfo').innerText = `Order ID: #${order.id}`;
            document.getElementById('paymentTotalAmount').innerText = `RM${Number(order.total_amount || 0).toFixed(2)}`;
            document.getElementById('paymentModal').classList.remove('hidden');
        }

        function closePaymentModal() { 
            document.getElementById('paymentModal').classList.add('hidden'); 
        }

        async function completePayment(method) {
            await _supabase.from('orders').update({ status: 'Completed', payment_status: 'Paid' }).eq('id', currentActiveOrderId);
            alert(`Payment completed via ${method}!`);
            closePaymentModal();
            closeOrderModal();
            loadPendingOrders();
        }

        function proceedToPaymentFromModal() {
            closeOrderModal();
            openPaymentModalFromList(activeOrderData);
        }

        function openNotificationModal() {
            document.getElementById('notificationModal').classList.remove('hidden');
            fetchIncomingOrders();
        }
        
        function closeNotificationModal() { 
            document.getElementById('notificationModal').classList.add('hidden'); 
        }

        // নোটিফিকেশন মডালে আইটেমের নাম সহ শো করানোর লজিক
        async function fetchIncomingOrders() {
            const { data } = await _supabase
                .from('orders')
                .select('*, order_items(*)')
                .eq('status', 'pending')
                .order('created_at', { ascending: false });

            const badge = document.getElementById('notificationBadge');
            const container = document.getElementById('incomingOrdersList');
            
            if(data && data.length > 0) {
                badge.innerText = data.length;
                badge.classList.remove('hidden');
                container.innerHTML = data.map(o => `
                    <div class="border p-3 rounded-xl bg-gray-50 space-y-2 text-xs">
                        <div class="flex justify-between items-center">
                            <div>
                                <span class="font-bold text-sm text-gray-900">Order #${o.id}</span>
                                <p class="text-gray-500">Table: ${o.table_id || 'N/A'} | RM${Number(o.total_amount || 0).toFixed(2)}</p>
                            </div>
                            <button onclick='openOrderDetails(${JSON.stringify(o)})' class="bg-gray-800 hover:bg-gray-900 text-white px-3 py-1 rounded-lg text-xs">Open</button>
                        </div>
                        <!-- নোটিফিকেশনের ভেতরে আইটেমগুলোর নাম ও পরিমাণ দেখানোর জায়গা -->
                        <div class="bg-white p-2 rounded border space-y-1 text-gray-700">
                            ${o.order_items && o.order_items.length > 0 
                                ? o.order_items.map(item => `<div>• ${item.item_name} (x${item.quantity})</div>`).join('') 
                                : '<span class="text-gray-400">No items found</span>'}
                        </div>
                    </div>
                `).join('');
            } else {
                badge.classList.add('hidden');
                container.innerHTML = '<p class="text-gray-500 text-sm text-center py-4">No new notifications.</p>';
            }
        }

        function setupRealtimeSubscription() {
            _supabase.channel('public:orders')
                .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'orders' }, payload => {
                    if(payload.new && payload.new.status === 'pending') {
                        fetchIncomingOrders();
                        loadPendingOrders();
                    }
                })
                .subscribe();
        }

        function doCheckIn() { alert("Checked-in!"); }
        function doCheckOut() { alert("Checked-out!"); }
        function refreshCashierSystem() { loadPendingOrders(); fetchIncomingOrders(); alert("Refreshed!"); }

        window.addEventListener('DOMContentLoaded', () => {
            checkAuthSession();
        });
    </script>
</body>
</html>
