<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hameeds Bistro - Cashier Panel</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 font-sans overflow-hidden">

    <div class="flex h-screen w-screen">
        
        <!-- Main Panel (Current Orders + Header) -->
        <div class="flex-1 flex flex-col h-full overflow-hidden">
            
            <!-- Header Panel -->
            <header class="bg-white border-b shadow-sm px-6 py-3 flex justify-between items-center">
                
                <!-- Left Side: Logo, Name, Welcome & Role -->
                <div class="flex items-center space-x-4">
                    <!-- Logo -->
                    <img src="images/logo.png" alt="Logo" class="w-12 h-12 rounded-full object-cover border-2 border-emerald-600" onerror="this.src='https://via.placeholder.com/50'">
                    
                    <div class="flex flex-col">
                        <h1 class="font-bold text-lg text-gray-900 leading-tight">Hameeds Bistro</h1>
                        <div class="flex items-center space-x-2 mt-0.5">
                            <span class="text-xs text-gray-500 font-medium">Welcome:</span>
                            <span id="cashierName" class="text-xs font-bold text-emerald-700">Prokash Rakshit</span>
                        </div>
                        <div class="flex items-center space-x-2 mt-0.5">
                            <span class="text-xs text-gray-500 font-medium">Role:</span>
                            <span id="cashierRole" class="text-xs uppercase font-bold text-blue-600">Cashier</span>
                        </div>
                    </div>
                </div>

                <!-- Right Side Buttons -->
                <div class="flex items-center space-x-2">
                    <div class="flex flex-col space-y-1">
                        <button id="checkInBtn" onclick="doCheckIn()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-3 py-1 rounded-lg text-xs font-medium shadow-sm transition text-center">
                            Check-In
                        </button>
                        <button id="checkOutBtn" onclick="doCheckOut()" class="bg-red-500 hover:bg-red-600 text-white px-3 py-1 rounded-lg text-xs font-medium shadow-sm transition text-center">
                            Check-Out
                        </button>
                    </div>

                    <!-- Notification Button -->
                    <div class="relative">
                        <button onclick="openNotificationModal()" class="bg-gray-100 hover:bg-gray-200 text-gray-700 p-2.5 rounded-xl text-sm font-medium shadow-sm transition flex items-center justify-center relative" title="New Order Notifications">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" />
                            </svg>
                            <span id="notificationBadge" class="absolute -top-1 -right-1 bg-red-600 text-white text-[10px] font-bold w-5 h-5 rounded-full flex items-center justify-center border-2 border-white hidden">0</span>
                        </button>
                    </div>

                    <!-- Refresh Button -->
                    <button onclick="refreshCashierSystem()" class="bg-gray-100 hover:bg-gray-200 text-gray-700 p-2.5 rounded-xl text-sm font-medium shadow-sm transition flex items-center justify-center" title="Refresh System">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                        </svg>
                    </button>

                    <!-- Admin Button -->
                    <button onclick="checkAdminAccess()" class="bg-blue-600 hover:bg-blue-700 text-white px-3 py-2 rounded-xl text-xs font-medium shadow-sm transition flex items-center gap-1">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
                        </svg>
                        Admin
                    </button>
                </div>
            </header>

            <!-- Main Panel (Current Orders in Grid) -->
            <main class="flex-1 p-6 bg-gray-50 overflow-y-auto">
                <div class="mb-4 flex justify-between items-center">
                    <h2 class="text-xl font-bold text-gray-800">Current Orders</h2>
                </div>
                <!-- Pending Order Cards Grid Container -->
                <div id="pendingOrdersContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                    <!-- Dynamic order cards will load here in grid -->
                </div>
            </main>
        </div>

        <!-- Right Sidebar Panel (~2 to 2.5 inches width for 14-inch display) -->
        <aside class="w-56 bg-gray-900 text-white flex flex-col p-4 justify-start space-y-3 shadow-xl flex-shrink-0">
            <div class="text-xs font-bold text-gray-400 mb-2 uppercase tracking-wider">Quick Actions</div>
            <button class="bg-emerald-700 hover:bg-emerald-800 text-white py-3 px-4 rounded-xl font-bold text-sm shadow transition text-center">NEW ORDER</button>
            <button class="bg-gray-800 hover:bg-gray-700 text-white py-3 px-4 rounded-xl font-bold text-sm shadow transition text-center">INVOICE LIST</button>
            <button class="bg-gray-800 hover:bg-gray-700 text-white py-3 px-4 rounded-xl font-bold text-sm shadow transition text-center">LAST RECEIPT</button>
        </aside>

    </div>

    <!-- 1. Order Detail & Extra Item Add Modal (Open Page) -->
    <div id="orderDetailModal" class="fixed inset-0 bg-black bg-opacity-60 flex items-center justify-center z-50 hidden">
        <div class="bg-white p-6 rounded-2xl max-w-2xl w-full shadow-2xl relative mx-4 max-h-[90vh] flex flex-col">
            <button onclick="closeOrderModal()" class="absolute top-4 right-4 bg-gray-200 hover:bg-gray-300 text-gray-700 w-8 h-8 rounded-full font-bold flex items-center justify-center text-lg">&times;</button>
            
            <h3 id="modalOrderTitle" class="font-bold text-xl text-gray-800 mb-1">Order Details</h3>
            <p id="modalOrderMeta" class="text-xs text-gray-500 mb-4"></p>

            <!-- Current Order Items List -->
            <div class="border rounded-xl p-3 mb-4 max-h-40 overflow-y-auto bg-gray-50" id="modalOrderItemsList"></div>

            <!-- Add Extra Item from Menu -->
            <div class="border-t pt-3 flex-1 flex flex-col">
                <h4 class="font-semibold text-gray-700 text-sm mb-2">Add Extra Item from Menu:</h4>
                <div class="flex gap-2 mb-3">
                    <select id="extraMenuItemSelect" class="flex-1 border px-3 py-2 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500"></select>
                    <button onclick="addExtraItemToOrder()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-xl text-sm font-medium">Add</button>
                </div>
            </div>

            <!-- Modal Action Buttons: Send & Payment -->
            <div class="flex justify-end space-x-3 mt-4 pt-3 border-t">
                <button onclick="closeOrderModal()" class="bg-gray-200 text-gray-700 px-4 py-2 rounded-xl text-sm font-medium">Close</button>
                <button onclick="sendOrderUpdates()" class="bg-amber-600 hover:bg-amber-700 text-white px-4 py-2 rounded-xl text-sm font-medium">Send</button>
                <button onclick="proceedToPaymentFromModal()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-xl text-sm font-medium">Payment</button>
            </div>
        </div>
    </div>

    <!-- 2. Payment Modal -->
    <div id="paymentModal" class="fixed inset-0 bg-black bg-opacity-60 flex items-center justify-center z-50 hidden">
        <div class="bg-white p-6 rounded-2xl max-w-md w-full shadow-2xl relative mx-4">
            <button onclick="closePaymentModal()" class="absolute top-4 right-4 bg-gray-200 hover:bg-gray-300 text-gray-700 w-8 h-8 rounded-full font-bold flex items-center justify-center text-lg">&times;</button>
            
            <h3 class="font-bold text-xl text-gray-800 mb-1">Complete Payment</h3>
            <p id="paymentOrderInfo" class="text-xs text-gray-500 mb-4"></p>

            <div class="bg-gray-50 p-4 rounded-xl border mb-4">
                <div class="flex justify-between mb-2">
                    <span class="text-gray-600">Total Amount:</span>
                    <span id="paymentTotalAmount" class="font-bold text-lg text-emerald-600">RM0.00</span>
                </div>
            </div>

            <div class="space-y-3 mb-5">
                <label class="block text-sm font-medium text-gray-700">Select Payment Method:</label>
                <div class="grid grid-cols-2 gap-3">
                    <button onclick="completePayment('Cash')" class="border-2 border-emerald-500 bg-emerald-50 text-emerald-700 py-3 rounded-xl font-semibold text-sm hover:bg-emerald-100 transition">Cash</button>
                    <button onclick="completePayment('QR / Online')" class="border-2 border-blue-500 bg-blue-50 text-blue-700 py-3 rounded-xl font-semibold text-sm hover:bg-blue-100 transition">QR / Online</button>
                </div>
            </div>

            <button onclick="closePaymentModal()" class="w-full bg-gray-200 text-gray-700 py-2 rounded-xl text-sm font-medium">Cancel</button>
        </div>
    </div>

    <!-- Notification Modal -->
    <div id="notificationModal" class="fixed inset-0 bg-black bg-opacity-60 flex items-center justify-center z-50 hidden">
        <div class="bg-white p-6 rounded-2xl max-w-lg w-full shadow-2xl relative mx-4 max-h-[80vh] flex flex-col">
            <button onclick="closeNotificationModal()" class="absolute top-4 right-4 bg-gray-200 hover:bg-gray-300 text-gray-700 w-8 h-8 rounded-full font-bold flex items-center justify-center text-lg">&times;</button>
            
            <h3 class="font-bold text-xl text-gray-800 mb-2">New Customer Order Notifications</h3>
            <p class="text-xs text-gray-500 mb-4">New customer orders waiting for acceptance.</p>

            <div class="flex-1 overflow-y-auto space-y-3 pr-1" id="incomingOrdersList"></div>

            <div class="mt-4 pt-3 border-t flex justify-end">
                <button onclick="closeNotificationModal()" class="bg-gray-200 text-gray-700 px-5 py-2 rounded-xl text-sm font-medium">Close</button>
            </div>
        </div>
    </div>

    <script>
        // Supabase Client Initialization (আপনার প্রজেক্টের ক্রিপডেনশিয়াল দিয়ে রিप्लेस করে নিন)
        const SUPABASE_URL = 'YOUR_SUPABASE_URL';
        const SUPABASE_KEY = 'YOUR_SUPABASE_ANON_KEY';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let currentActiveOrderId = null;
        let activeOrderData = null;

        // 1. Load Pending Orders in Grid Layout
        async function loadPendingOrders() {
            const container = document.getElementById('pendingOrdersContainer');
            if(!container) return;
            container.innerHTML = '<p class="text-gray-500 text-sm col-span-full">Loading current orders...</p>';

            const { data, error } = await _supabase
                .from('orders')
                .select('*')
                .eq('status', 'Pending')
                .order('created_at', { ascending: false });

            if(error) {
                console.error("Error loading orders:", error);
                container.innerHTML = '<p class="text-red-500 text-sm col-span-full">Failed to load orders.</p>';
                return;
            }

            if(!data || data.length === 0) {
                container.innerHTML = '<p class="text-gray-500 text-sm col-span-full">No pending orders available.</p>';
                return;
            }

            container.innerHTML = data.map(order => `
                <div class="bg-white border border-gray-200 p-4 rounded-2xl shadow-sm flex flex-col justify-between space-y-3">
                    <div>
                        <div class="flex justify-between items-start mb-2">
                            <span class="font-bold text-gray-900 text-base">Order #${order.id}</span>
                            <span class="bg-amber-100 text-amber-800 text-[10px] px-2 py-0.5 rounded-full font-semibold">Table: ${order.table_id || 'N/A'}</span>
                        </div>
                        <div class="text-xs text-gray-500 flex items-center gap-1 mb-2">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
                            </svg>
                            <span>Time: ${new Date(order.created_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}</span>
                        </div>
                        <div class="text-sm font-bold text-emerald-600">Total: RM${Number(order.total_amount || 0).toFixed(2)}</div>
                    </div>

                    <!-- Card Action Buttons: Open & Payment -->
                    grid grid-cols-2 gap-2 pt-2 border-t">
                        <button onclick='openOrderDetails(${JSON.stringify(order)})' class="bg-gray-800 hover:bg-gray-900 text-white py-2 rounded-xl text-xs font-semibold shadow transition text-center">
                            Open
                        </button>
                        <button onclick='openPaymentModalFromList(${JSON.stringify(order)})' class="bg-emerald-600 hover:bg-emerald-700 text-white py-2 rounded-xl text-xs font-semibold shadow transition text-center">
                            Payment
                        </button>
                    </div>
                </div>
            `).join('');
        }

        // 2. Open Order Details Modal
        async function openOrderDetails(order) {
            currentActiveOrderId = order.id;
            activeOrderData = order;

            document.getElementById('modalOrderTitle').innerText = `Order ID: #${order.id}`;
            document.getElementById('modalOrderMeta').innerText = `Table: ${order.table_id || 'N/A'} | Time: ${new Date(order.created_at).toLocaleTimeString()}`;
            
            const itemsContainer = document.getElementById('modalOrderItemsList');
            itemsContainer.innerHTML = '<p class="text-xs text-gray-500">Loading items...</p>';

            const { data: orderItems, error } = await _supabase
                .from('order_items')
                .select('*')
                .eq('order_id', order.id);

            if(error || !orderItems || orderItems.length === 0) {
                itemsContainer.innerHTML = '<p class="text-gray-500 text-xs">No items found.</p>';
            } else {
                itemsContainer.innerHTML = orderItems.map(i => `
                    <div class="flex justify-between items-center text-xs py-1 border-b border-gray-200 last:border-none">
                        <span>${i.item_name} (x${i.quantity})</span>
                        <span class="font-semibold">RM${Number(i.price * i.quantity).toFixed(2)}</span>
                    </div>
                `).join('');
            }

            loadMenuForDropdown();
            document.getElementById('orderDetailModal').classList.remove('hidden');
        }

        function closeOrderModal() {
            document.getElementById('orderDetailModal').classList.add('hidden');
        }

        // 3. Load Menu Dropdown for Adding Extra Items
        async function loadMenuForDropdown() {
            const select = document.getElementById('extraMenuItemSelect');
            if(!select) return;
            
            const { data, error } = await _supabase.from('menu_items').select('*');
            if(error || !data) {
                select.innerHTML = '<option value="">Failed to load menu</option>';
                return;
            }

            select.innerHTML = data.map(m => `<option value="${m.id}" data-price="${m.price}" data-name="${m.name}">${m.name} - RM${m.price}</option>`).join('');
        }

        // 4. Add Extra Item to Order
        async function addExtraItemToOrder() {
            const select = document.getElementById('extraMenuItemSelect');
            const selectedOption = select.options[select.selectedIndex];
            if(!selectedOption) return;

            const itemId = selectedOption.value;
            const itemName = selectedOption.getAttribute('data-name');
            const itemPrice = parseFloat(selectedOption.getAttribute('data-price'));

            const { error } = await _supabase.from('order_items').insert([
                { order_id: currentActiveOrderId, menu_item_id: itemId, item_name: itemName, price: itemPrice, quantity: 1 }
            ]);

            if(error) {
                alert('Failed to add extra item!');
                return;
            }

            alert('Extra item added successfully!');
            openOrderDetails(activeOrderData);
            loadPendingOrders();
        }

        // 5. Send Order Updates / Kitchen Action
        async function sendOrderUpdates() {
            alert(`Order #${currentActiveOrderId} updates sent successfully!`);
            closeOrderModal();
            loadPendingOrders();
        }

        // 6. Payment Functions
        function openPaymentModalFromList(order) {
            currentActiveOrderId = order.id;
            document.getElementById('paymentOrderInfo').innerText = `Order ID: #${order.id} | Table: ${order.table_id || 'N/A'}`;
            document.getElementById('paymentTotalAmount').innerText = `RM${Number(order.total_amount || 0).toFixed(2)}`;
            document.getElementById('paymentModal').classList.remove('hidden');
        }

        function closePaymentModal() {
            document.getElementById('paymentModal').classList.add('hidden');
        }

        async function completePayment(method) {
            const { error } = await _supabase
                .from('orders')
                .update({ status: 'Completed', payment_status: 'Paid' })
                .eq('id', currentActiveOrderId);

            if(error) {
                alert('Failed to complete payment!');
                return;
            }

            alert(`Payment completed via ${method} successfully!`);
            closePaymentModal();
            closeOrderModal();
            loadPendingOrders();
        }

        function proceedToPaymentFromModal() {
            closeOrderModal();
            openPaymentModalFromList(activeOrderData);
        }

        // Notifications Handling
        function openNotificationModal() {
            document.getElementById('notificationModal').classList.remove('hidden');
            fetchIncomingOrders();
        }
        function closeNotificationModal() {
            document.getElementById('notificationModal').classList.add('hidden');
        }

        async function fetchIncomingOrders() {
            const container = document.getElementById('incomingOrdersList');
            container.innerHTML = '<p class="text-gray-500 text-sm">Loading...</p>';

            const { data, error } = await _supabase
                .from('orders')
                .select('*')
                .eq('status', 'Pending Customer Order')
                .order('created_at', { ascending: false });

            if (error) {
                container.innerHTML = '<p class="text-red-500 text-sm">Failed to load notifications.</p>';
                return;
            }

            const badge = document.getElementById('notificationBadge');
            if (data && data.length > 0) {
                badge.innerText = data.length;
                badge.classList.remove('hidden');
                
                container.innerHTML = data.map(order => `
                    <div class="border border-gray-200 p-3 rounded-xl bg-gray-50 flex justify-between items-center text-xs">
                        <div>
                            <span class="font-bold text-gray-800">Order ID: #${order.id}</span>
                            <p class="text-gray-600">Table: ${order.table_id || 'N/A'} | Total: RM${Number(order.total_amount).toFixed(2)}</p>
                        </div>
                        <button onclick="acceptNotificationOrder(${order.id})" class="bg-emerald-600 hover:bg-emerald-700 text-white px-3 py-1.5 rounded-lg font-semibold shadow">
                            Accept
                        </button>
                    </div>
                `).join('');
            } else {
                badge.classList.add('hidden');
                container.innerHTML = '<p class="text-gray-500 text-sm">No new notifications.</p>';
            }
        }

        async function acceptNotificationOrder(orderId) {
            const { error } = await _supabase
                .from('orders')
                .update({ status: 'Pending' }) 
                .eq('id', orderId);

            if (error) {
                alert('Failed to accept order!');
                return;
            }

            alert(`Order #${orderId} accepted into Current Orders!`);
            fetchIncomingOrders();
            loadPendingOrders();
        }

        // Basic Control Buttons
        function doCheckIn() { alert("Checked-in successfully!"); }
        function doCheckOut() { alert("Checked-out successfully!"); }
        function refreshCashierSystem() { loadPendingOrders(); alert("System refreshed!"); }
        function checkAdminAccess() { alert("Admin password prompt."); }

        // Initial Setup
        window.addEventListener('DOMContentLoaded', () => {
            loadPendingOrders();
        });
    </script>
</body>
</html>
