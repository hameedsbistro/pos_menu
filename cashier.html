<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hameeds Bistro - Cashier System</title>
    <style>
        :root {
            --primary-color: #2c3e50;
            --accent-color: #e67e22;
            --bg-color: #f4f6f7;
            --text-color: #333;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }
        .hidden {
            display: none !important;
        }
        /* Login Section Styles */
        #loginSection {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .login-card {
            background: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            width: 320px;
            text-align: center;
        }
        .login-card h2 {
            margin-bottom: 20px;
            color: var(--primary-color);
        }
        .login-card input {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        .login-card button {
            width: 100%;
            padding: 10px;
            background: var(--accent-color);
            color: #fff;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
        }
        .login-card button:hover {
            background: #d35400;
        }
        /* Main Panel Styles */
        #mainPanel {
            display: flex;
            width: 100%;
            height: 100%;
        }
        .sidebar {
            width: 250px;
            background: var(--primary-color);
            color: #fff;
            display: flex;
            flex-direction: column;
        }
        .sidebar-header {
            padding: 20px;
            font-size: 20px;
            font-weight: bold;
            background: #1a252f;
            text-align: center;
        }
        .sidebar-menu {
            list-style: none;
            padding: 20px 0;
        }
        .sidebar-menu li {
            padding: 12px 20px;
            cursor: pointer;
            transition: background 0.3s;
        }
        .sidebar-menu li:hover {
            background: #34495e;
        }
        .content-area {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
        }
        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            background: #fff;
            padding: 15px 20px;
            border-radius: 6px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
        }
        .card {
            background: #fff;
            padding: 20px;
            border-radius: 6px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
    </style>
</head>
<body>

    <!-- Login Section -->
    <div id="loginSection">
        <div class="login-card">
            <h2>Hameeds Bistro</h2>
            <input type="text" id="username" placeholder="Username" required>
            <input type="password" id="password" placeholder="Password" required>
            <button onclick="handleLogin()">Login</button>
        </div>
    </div>

    <!-- Main Panel -->
    <div id="mainPanel" class="hidden">
        <div class="sidebar">
            <div class="sidebar-header">Hameeds POS</div>
            <ul class="sidebar-menu">
                <li>Dashboard</li>
                <li>POS / Cashier</li>
                <li>QR Menu Management</li>
                <li>Reports</li>
                <li onclick="handleLogout()">Logout</li>
            </ul>
        </div>
        <div class="content-area">
            <div class="header-bar">
                <h2>Dashboard Overview</h2>
                <span id="currentUser">Welcome, Admin</span>
            </div>
            <div class="dashboard-grid">
                <div class="card">
                    <h3>Today's Orders</h3>
                    <p style="font-size: 24px; margin-top: 10px; font-weight: bold; color: var(--accent-color);">24</p>
                </div>
                <div class="card">
                    <h3>Active QR Menus</h3>
                    <p style="font-size: 24px; margin-top: 10px; font-weight: bold; color: var(--accent-color);">12</p>
                </div>
                <div class="card">
                    <h3>Total Revenue</h3>
                    <p style="font-size: 24px; margin-top: 10px; font-weight: bold; color: var(--accent-color);">$1,450</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        function handleLogin() {
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;
            
            if(user.trim() !== "" && pass.trim() !== "") {
                document.getElementById('loginSection').classList.add('hidden');
                document.getElementById('mainPanel').classList.remove('hidden');
                document.getElementById('currentUser').innerText = `Welcome, ${user}`;
            } else {
                alert('Please enter valid credentials.');
            }
        }

        function handleLogout() {
            document.getElementById('mainPanel').classList.add('hidden');
            document.getElementById('loginSection').classList.remove('hidden');
            document.getElementById('username').value = '';
            document.getElementById('password').value = '';
        }
    </script>
</body>
</html>
