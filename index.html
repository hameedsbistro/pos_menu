<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restoran Hameeds Bistro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col justify-between font-sans">

    <!-- হেডার -->
    <header class="bg-blue-900 text-white p-4 shadow-lg flex justify-between items-center relative">
        <div class="flex items-center gap-3">
            <button onclick="toggleSidebar()" class="p-2 bg-blue-800 rounded-lg"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg></button>
            <h1 class="text-lg font-bold">Restoran Hameeds Bistro</h1>
        </div>
        <div class="flex items-center gap-2">
            <button id="mainAuthBtn" onclick="handleAuthClick()" class="p-2 bg-blue-800 rounded-lg text-sm font-semibold"><span id="loginBtnText">Login</span></button>
            <button onclick="openChat()" class="p-2 bg-blue-800 rounded-lg text-sm font-semibold">Live Chat</button>
        </div>
    </header>

    <!-- সাইডবার -->
    <div id="sidebar" class="fixed inset-y-0 left-0 w-72 bg-white shadow-2xl z-50 transform -translate-x-full transition-transform duration-300 p-6">
        <button onclick="toggleSidebar()" class="text-xl font-bold">✕</button>
        <div class="mt-6 mb-6">
            <select id="langSelect" onchange="changeLanguage(this.value)" class="w-full border p-2 rounded-lg"></select>
        </div>
        <div id="sidebarProfile" class="mb-6 p-4 bg-gray-50 rounded-lg border hidden">
            <h3 class="font-bold" id="profileName">Guest</h3>
            <button onclick="logoutCustomer()" class="text-red-600 font-bold">Logout</button>
        </div>
        <ul class="space-y-3 font-semibold">
            <li><a href="#" onclick="toggleSidebar(); showHome();">Home</a></li>
            <li><a href="#" onclick="toggleSidebar(); showOrderHistory();">Order History</a></li>
        </ul>
    </div>
        <main class="p-6 max-w-4xl mx-auto flex-grow w-full">
        <!-- হোম পেজ -->
        <div id="homeView" class="bg-white p-8 rounded-2xl shadow-md text-center">
            <h2 class="text-3xl font-bold mb-8">Welcome to Hameeds Bistro</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <button onclick="startOrder('dine_in')" class="bg-blue-600 text-white p-6 rounded-xl font-bold">🍽️ Dine-In</button>
                <button onclick="startOrder('takeaway')" class="bg-green-600 text-white p-6 rounded-xl font-bold">🛍️ Takeaway</button>
            </div>
        </div>

        <!-- অর্ডার পেজ -->
        <div id="orderView" class="hidden">
            <div id="categoryContainer" class="mb-6 flex gap-3 overflow-x-auto pb-2"></div>
            <div id="menuContainer" class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-24"></div>
        </div>
        
        <!-- অর্ডার হিস্টরি -->
        <div id="historyView" class="hidden">
            <div id="orderHistoryContainer" class="space-y-4"></div>
        </div>
        </main>
            <div id="cartBar" class="hidden fixed bottom-16 left-0 right-0 bg-blue-900 text-white p-4 shadow-2xl flex justify-between items-center max-w-4xl mx-auto rounded-t-2xl">
        <button onclick="openCheckoutModal()" class="bg-yellow-500 text-black px-6 py-3 rounded-xl font-bold">View Cart & Checkout</button>
    </div>

    <!-- লগইন ও চেকআউট মোডাল -->
    <div id="loginModal" class="hidden fixed inset-0 bg-black bg-opacity-50 z-50 flex justify-center items-center p-4">
        <div class="bg-white rounded-2xl max-w-sm w-full p-6 shadow-2xl">
            <!-- ফর্ম কন্টেন্ট -->
            <button onclick="closeLoginModal()" class="mt-4 bg-gray-200 py-2 w-full rounded-xl">Close</button>
        </div>
    </div>

    <footer class="bg-gray-900 text-white text-center py-4">Copyright © 2026 Rudranshi</footer>
        <script>
        const SUPABASE_URL = 'YOUR_SUPABASE_URL';
        const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // লগইন ও প্রোফাইল হ্যান্ডলিং
        function handleAuthClick() {
            if (localStorage.getItem('hameeds_customer')) {
                toggleSidebar();
            } else {
                document.getElementById('loginModal').classList.remove('hidden');
            }
        }

        function loginCustomer() {
            // লগইন লজিক এখানে হবে
            alert('Login logic processed');
        }

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('-translate-x-full');
        }

        function showHome() {
            document.getElementById('homeView').classList.remove('hidden');
            document.getElementById('orderView').classList.add('hidden');
            document.getElementById('historyView').classList.add('hidden');
        }
        
        // অন্যান্য ফাংশনগুলো এখানে পর্যায়ক্রমে যুক্ত করতে হবে...
    </script>
</body>
</html>
