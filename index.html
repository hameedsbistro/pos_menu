<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hameeds Bistro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { padding-bottom: 90px; }
        #cartBar { position: fixed; bottom: 0; left: 0; width: 100%; z-index: 1000; }
        .hidden { display: none !important; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen">
    <header class="bg-blue-900 text-white p-4 flex justify-between items-center sticky top-0 z-50 shadow-md">
        <div class="flex items-center gap-3">
            <button onclick="toggleSidebar()" class="p-2 bg-blue-800 rounded-lg">☰</button>
            <div>
                <h1 id="headerTitle" class="font-bold">Hameeds Bistro</h1>
                <p id="headerSub" class="text-[10px] text-yellow-300">Dine-In & Takeaway</p>
            </div>
        </div>
        <div class="flex items-center gap-2">
            <select id="langSelect" onchange="changeLanguage(this.value)" class="bg-blue-800 text-[10px] p-1 rounded text-white outline-none">
                <option value="en">English</option><option value="ms">Malay</option>
                <option value="bn">Bengali</option><option value="hi">Hindi</option>
                <option value="ta">Tamil</option><option value="zh">Chinese</option>
                <option value="ar">Arabic</option>
            </select>
            <button onclick="openLoginModal()" id="loginBtnText" class="text-xs font-semibold bg-blue-800 px-2 py-1 rounded">Login</button>
        </div>
    </header>

    <div id="sidebar" class="fixed inset-y-0 left-0 w-64 bg-white z-50 transform -translate-x-full transition p-6 shadow-2xl">
        <h2 class="font-bold mb-4">Menu & Profile</h2>
        <ul class="space-y-4">
            <li><button onclick="showHome(); toggleSidebar();">🏠 Home</button></li>
            <li><button onclick="showOrderHistory(); toggleSidebar();">📦 Order History</button></li>
            <li><button onclick="showCustomerProfile(); toggleSidebar();">👤 Customer Profile</button></li>
            <li><button onclick="logoutCustomer(); toggleSidebar();" class="text-red-600">Logout</button></li>
        </ul>
    </div>

    <main class="p-4">
        <div id="homeView"><h2 id="welcomeTitle" class="text-xl font-bold">Welcome to Hameeds Bistro</h2></div>
        <div id="orderView" class="hidden">Order Content</div>
        <div id="historyView" class="hidden">History Content</div>
        <div id="profileView" class="hidden">Profile Content</div>
    </main>

    <div id="cartBar" class="hidden bg-blue-900 text-white p-4 flex justify-between items-center shadow-2xl">
        <div><span id="cartCount">0</span> Items | <span id="cartSubtotal" class="font-bold">৳0</span></div>
        <button onclick="alert('Checkout')" class="bg-yellow-500 text-black px-4 py-2 rounded font-bold">Checkout</button>
    </div>
        <script>
        const _supabase = supabase.createClient('YOUR_URL', 'YOUR_KEY');
        let cart = [];
        const langData = {
            en: { title: "Hameeds Bistro", sub: "Dine-In & Takeaway", login: "Login", welcome: "Welcome" },
            ms: { title: "Hameeds Bistro", sub: "Dine-In & Takeaway", login: "Log Masuk", welcome: "Selamat Datang" },
            bn: { title: "হামিডস বিস্ট্রো", sub: "ডাইন-ইন ও টেকঅ্যাওয়ে", login: "লগইন", welcome: "হামিডস বিস্ট্রোতে স্বাগতম" },
            hi: { title: "हमीद्स बिस्ट्रो", sub: "डाइन-इन और टेकअवे", login: "लॉगिन", welcome: "स्वागत है" },
            ta: { title: "ஹமீட்ஸ் பிஸ்ட்ரோ", sub: "டைன்-இன் & டேக்அவே", login: "உள்நுழைய", welcome: "வரவேற்கிறோம்" },
            zh: { title: "哈米德小酒馆", sub: "堂食与外卖", login: "登录", welcome: "欢迎" },
            ar: { title: "حميد بيسترو", sub: "تناول الطعام", login: "تسجيل الدخول", welcome: "أهلاً بك" }
        };

        function changeLanguage(lang) {
            const d = langData[lang];
            document.getElementById('headerTitle').innerText = d.title;
            document.getElementById('headerSub').innerText = d.sub;
            document.getElementById('loginBtnText').innerText = d.login;
            document.getElementById('welcomeTitle').innerText = d.welcome;
            localStorage.setItem('lang', lang);
        }

        function toggleSidebar() { document.getElementById('sidebar').classList.toggle('-translate-x-full'); }

        function updateCartBar() {
            const bar = document.getElementById('cartBar');
            bar.classList.toggle('hidden', cart.length === 0);
        }

        function showHome() {
            document.getElementById('homeView').classList.remove('hidden');
            document.getElementById('orderView').classList.add('hidden');
            document.getElementById('historyView').classList.add('hidden');
            document.getElementById('profileView').classList.add('hidden');
        }

        function openLoginModal() { alert('Login modal opened'); }
        function logoutCustomer() { localStorage.removeItem('hameeds_customer'); location.reload(); }
        
        // পেজ লোড
        document.addEventListener('DOMContentLoaded', () => {
            const saved = localStorage.getItem('lang') || 'en';
            document.getElementById('langSelect').value = saved;
            changeLanguage(saved);
        });
    </script>
</body>
</html>
