<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restoran Hameeds Bistro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 font-sans">
        <!-- Header Section -->
    <header class="bg-blue-900 text-white p-4 shadow-lg flex justify-between items-center relative">
        <div class="flex items-center gap-3">
            <button onclick="toggleSidebar()" class="p-2 bg-blue-800 rounded-lg hover:bg-blue-700 transition">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
            </button>
            <img src="images/logo.png" alt="Logo" class="h-12 w-12 rounded-full border-2 border-yellow-400 object-cover">
            <div>
                <h1 class="text-lg font-bold uppercase tracking-wider">Restoran Hameeds Bistro</h1>
                <p class="text-xs text-yellow-300" data-i18n="subtitle">Dine-In & Takeaway Ordering System</p>
            </div>
        </div>

        <div class="flex items-center gap-2">
            <button id="mainAuthBtn" onclick="handleAuthClick()" class="p-2 bg-blue-800 rounded-lg hover:bg-blue-700 transition flex items-center gap-1 text-sm font-semibold">
                <svg class="w-5 h-5 text-yellow-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                <span id="loginBtnText" data-i18n="login">Login</span>
            </button>
            <button onclick="openChat()" class="p-2 bg-blue-800 hover:bg-blue-700 rounded-lg transition flex items-center gap-1 text-sm font-semibold">
                <svg class="w-5 h-5 text-green-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 10h.01M12 10h.01M16 10h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"></path></svg>
                <span class="hidden md:inline" data-i18n="liveChat">Live Chat</span>
            </button>
        </div>
    </header>
        <!-- Login Modal -->
    <div id="loginModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4">
        <div class="bg-white rounded-lg p-6 w-full max-w-md shadow-xl relative">
            <button onclick="closeLoginModal()" class="absolute top-3 right-3 text-gray-500 hover:text-gray-700 text-xl font-bold">&times;</button>
            <h2 id="authTitle" class="text-xl font-bold mb-4 text-blue-900">Customer Login</h2>
            
            <div id="loginForm" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700">Email</label>
                    <input type="email" id="loginEmail" class="w-full border rounded-lg p-2 mt-1 focus:ring focus:ring-blue-300">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Password</label>
                    <input type="password" id="loginPassword" class="w-full border rounded-lg p-2 mt-1 focus:ring focus:ring-blue-300">
                </div>
                <button onclick="loginCustomer()" class="w-full bg-blue-900 text-white p-2 rounded-lg hover:bg-blue-800 font-semibold">Login</button>
                <p class="text-sm text-center text-gray-600 mt-2">Don't have an account? <span onclick="toggleAuthMode('register')" class="text-blue-600 cursor-pointer font-semibold">Register</span></p>
            </div>

            <div id="registerForm" class="hidden space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700">Full Name</label>
                    <input type="text" id="regName" class="w-full border rounded-lg p-2 mt-1">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Phone</label>
                    <input type="text" id="regPhone" class="w-full border rounded-lg p-2 mt-1">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Email</label>
                    <input type="email" id="regEmail" class="w-full border rounded-lg p-2 mt-1">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Password</label>
                    <input type="password" id="regPassword" class="w-full border rounded-lg p-2 mt-1">
                </div>
                <button onclick="registerCustomer()" class="w-full bg-blue-900 text-white p-2 rounded-lg hover:bg-blue-800 font-semibold">Register</button>
                <p class="text-sm text-center text-gray-600 mt-2">Already have an account? <span onclick="toggleAuthMode('login')" class="text-blue-600 cursor-pointer font-semibold">Login</span></p>
            </div>
        </div>
    </div>

    <!-- Checkout Modal -->
    <div id="checkoutModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4">
        <div class="bg-white rounded-lg p-6 w-full max-w-lg shadow-xl relative max-h-[90vh] overflow-y-auto">
            <button onclick="closeCheckoutModal()" class="absolute top-3 right-3 text-gray-500 hover:text-gray-700 text-xl font-bold">&times;</button>
            <h2 class="text-xl font-bold mb-4 text-blue-900">Checkout Order</h2>
            
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700">Customer Name</label>
                    <input type="text" id="checkoutName" class="w-full border rounded-lg p-2 mt-1 bg-gray-50" readonly>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Phone Number</label>
                    <input type="text" id="checkoutPhone" class="w-full border rounded-lg p-2 mt-1 bg-gray-50" readonly>
                </div>

                <div class="border-t border-b py-3 my-2">
                    <h3 class="font-semibold text-sm mb-2 text-gray-700">Order Items:</h3>
                    <div id="checkoutItemsList" class="space-y-2 max-h-40 overflow-y-auto pr-2"></div>
                </div>

                <div class="space-y-1 text-sm text-gray-600">
                    <div class="flex justify-between"><span>Subtotal:</span><span id="modalSubtotal">৳0.00</span></div>
                    <div class="flex justify-between"><span>SST Tax (6%):</span><span id="modalTax">৳0.00</span></div>
                    <div class="flex justify-between font-bold text-base text-black border-t pt-1"><span>Total:</span><span id="modalTotal">৳0.00</span></div>
                </div>

                <button onclick="submitOrder()" class="w-full bg-green-600 text-white p-3 rounded-lg hover:bg-green-700 font-bold transition">Confirm & Submit Order</button>
            </div>
        </div>
    </div>
        <!-- Main Content Body placeholder -->
    <main class="p-4 max-w-6xl mx-auto">
        <div id="sidebarProfile" class="hidden bg-white p-4 rounded-lg shadow mb-4">
            <h3 id="profileName" class="font-bold text-lg"></h3>
            <p id="profileEmail" class="text-gray-600 text-sm"></p>
            <button onclick="logoutCustomer()" class="mt-2 bg-red-500 text-white px-3 py-1 rounded text-sm">Logout</button>
        </div>
    </main>

    <!-- JavaScript Base Variables -->
    <script>
        const SUPABASE_URL = 'https://tbvcaolnufayuvrqicpd.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRidmNhb2xudWZheXV2cnFpY3BkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYyMTI4MzYsImV4cCI6MjEwMTc4ODgzNn0.Cn2L569yd9qG8t1fXWN9rnwZ03Yott5P-doedUv1ItU';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let loggedInCustomer = JSON.parse(localStorage.getItem('hameeds_customer')) || null;
        let cart = [];
        let currentLang = 'en';
        let currentOrderType = 'takeaway';

        window.onload = function() {
            updateLoginUI();
        };

        function toggleSidebar() {
            alert('Sidebar toggle functionality');
        }
        function showHome() {
            cart = [];
        }
    </script>
        <script>
        function openCart() {
            const cartModal = document.getElementById('cartModal');
            if(cartModal) {
                cartModal.classList.remove('hidden');
                renderCartItems();
            }
        }

        function closeCart() {
            const cartModal = document.getElementById('cartModal');
            if(cartModal) {
                cartModal.classList.add('hidden');
            }
        }

        function renderCartItems() {
            const list = document.getElementById('cartItemsList');
            const countBadge = document.getElementById('cartCount');
            
            const totalCount = cart.reduce((sum, i) => sum + i.quantity, 0);
            if(countBadge) countBadge.innerText = totalCount;

            if(!list) return;

            if(cart.length === 0) {
                list.innerHTML = `<p class="text-center text-gray-500 py-4">Your cart is empty</p>`;
                return;
            }

            list.innerHTML = cart.map((i, index) => {
                let name = currentLang === 'bn' && i.name_bn ? i.name_bn : i.name_en;
                return `
                    <div class="flex justify-between items-center border-b py-2 text-sm">
                        <div>
                            <span class="font-semibold">${name}</span>
                            <div class="text-xs text-gray-500">৳${i.price} x ${i.quantity}</div>
                        </div>
                        <div class="flex items-center gap-2">
                            <button onclick="changeQuantity(${index}, -1)" class="px-2 bg-gray-200 rounded">-</button>
                            <span>${i.quantity}</span>
                            <button onclick="changeQuantity(${index}, 1)" class="px-2 bg-gray-200 rounded">+</button>
                            <button onclick="removeItem(${index})" class="text-red-500 ml-2">×</button>
                        </div>
                    </div>
                `;
            }).join('');

            const subtotal = cart.reduce((sum, i) => sum + (i.price * i.quantity), 0);
            const cartSubtotal = document.getElementById('cartSubtotal');
            if(cartSubtotal) cartSubtotal.innerText = `৳${subtotal.toFixed(2)}`;
        }

        function changeQuantity(index, delta) {
            cart[index].quantity += delta;
            if(cart[index].quantity <= 0) {
                cart.splice(index, 1);
            }
            renderCartItems();
        }

        function removeItem(index) {
            cart.splice(index, 1);
            renderCartItems();
        }
                    function openCheckoutModal() {
            if (!loggedInCustomer) {
                closeCart();
                closeCheckoutModal();
                openLoginModal();
                alert('Please login first to proceed with checkout.');
                return;
            }

            if(loggedInCustomer) {
                const nameField = document.getElementById('checkoutName');
                const phoneField = document.getElementById('checkoutPhone');
                if(nameField) nameField.value = loggedInCustomer.full_name || '';
                if(phoneField) phoneField.value = loggedInCustomer.phone || '';
            }

            const subtotal = cart.reduce((sum, i) => sum + (i.price * i.quantity), 0);
            const tax = subtotal * 0.06;
            const total = subtotal + tax;

            const modalSubtotal = document.getElementById('modalSubtotal');
            const modalTax = document.getElementById('modalTax');
            const modalTotal = document.getElementById('modalTotal');

            if(modalSubtotal) modalSubtotal.innerText = `৳${subtotal.toFixed(2)}`;
            if(modalTax) modalTax.innerText = `৳${tax.toFixed(2)}`;
            if(modalTotal) modalTotal.innerText = `৳${total.toFixed(2)}`;

            const list = document.getElementById('checkoutItemsList');
            if(list) {
                list.innerHTML = cart.map(i => {
                    let name = currentLang === 'bn' && i.name_bn ? i.name_bn : i.name_en;
                    return `<div class="flex justify-between text-sm"><span>${name} x ${i.quantity}</span><span>৳${(i.price * i.quantity).toFixed(2)}</span></div>`;
                }).join('');
            }
            
            const checkoutModal = document.getElementById('checkoutModal');
            if(checkoutModal) {
                checkoutModal.classList.remove('hidden');
            }
        }

        function closeCheckoutModal() { 
            const checkoutModal = document.getElementById('checkoutModal');
            if(checkoutModal) checkoutModal.classList.add('hidden'); 
        }

        async function submitOrder() {
            const name = document.getElementById('checkoutName').value;
            const phone = document.getElementById('checkoutPhone').value;
            let section = 'takeaway';
            let tableId = 'TAKEAWAY-' + Math.floor(1000 + Math.random() * 9000);

            if(typeof currentOrderType !== 'undefined' && currentOrderType === 'dine_in') {
                section = document.getElementById('activeSectionSelect').value;
                tableId = document.getElementById('activeTableSelect').value;
            }

            const subtotal = cart.reduce((sum, i) => sum + (i.price * i.quantity), 0);
            const tax = subtotal * 0.06;
            const total = subtotal + tax;

            const { data: orderData, error } = await _supabase.from('orders').insert([{
                customer_id: loggedInCustomer ? loggedInCustomer.id : null,
                customer_name: name,
                customer_phone: phone,
                order_type: typeof currentOrderType !== 'undefined' ? currentOrderType : 'takeaway',
                section: section,
                table_id: tableId,
                subtotal: subtotal,
                sst_tax: tax,
                total_amount: total,
                status: 'pending',
                payment_status: 'unpaid'
            }]).select().single();

            if(error) { 
                alert('Order failed! Please try again.'); 
                return; 
            }

            const orderItems = cart.map(i => ({
                order_id: orderData.id,
                menu_item_id: i.id,
                quantity: i.quantity,
                price: i.price
            }));

            await _supabase.from('order_items').insert(orderItems);
            
            alert('Order placed successfully! Sent to Cashier.');
            cart = [];
            closeCheckoutModal();
            closeCart();
            if(typeof showHome === 'function') showHome();
                    }
                    function handleAuthClick() {
            if (loggedInCustomer) {
                toggleSidebar();
            } else {
                openLoginModal();
            }
        }

        function openLoginModal() { document.getElementById('loginModal').classList.remove('hidden'); }
        function closeLoginModal() { document.getElementById('loginModal').classList.add('hidden'); }
        
        function toggleAuthMode(mode) {
            if(mode === 'register') {
                document.getElementById('loginForm').classList.add('hidden');
                document.getElementById('registerForm').classList.remove('hidden');
                document.getElementById('authTitle').innerText = 'Customer Register';
            } else {
                document.getElementById('registerForm').classList.add('hidden');
                document.getElementById('loginForm').classList.remove('hidden');
                document.getElementById('authTitle').innerText = 'Customer Login';
            }
        }

        async function registerCustomer() {
            const full_name = document.getElementById('regName').value;
            const phone = document.getElementById('regPhone').value;
            const email = document.getElementById('regEmail').value;
            const password = document.getElementById('regPassword').value;

            const { data, error } = await _supabase.from('customers').insert([{ full_name, phone, email, password }]).select().single();
            if(error) { alert('Registration failed or email already exists.'); return; }
            alert('Registration successful! Please login.');
            toggleAuthMode('login');
        }

        async function loginCustomer() {
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;

            const { data, error } = await _supabase.from('customers').select('*').eq('email', email).eq('password', password).single();
            if(error || !data) { alert('Invalid email or password.'); return; }

            loggedInCustomer = data;
            localStorage.setItem('hameeds_customer', JSON.stringify(data));
            updateLoginUI();
            closeLoginModal();
            alert('Login successful!');
        }

        function logoutCustomer() {
            loggedInCustomer = null;
            localStorage.removeItem('hameeds_customer');
            updateLoginUI();
            showHome();
            alert('Logged out successfully.');
        }

        function updateLoginUI() {
            const profileDiv = document.getElementById('sidebarProfile');
            if(loggedInCustomer) {
                document.getElementById('loginBtnText').innerText = loggedInCustomer.full_name.split(' ')[0];
                if(profileDiv) profileDiv.classList.remove('hidden');
                const pName = document.getElementById('profileName');
                const pEmail = document.getElementById('profileEmail');
                if(pName) pName.innerText = loggedInCustomer.full_name;
                if(pEmail) pEmail.innerText = loggedInCustomer.email;
            } else {
                document.getElementById('loginBtnText').innerText = 'Login';
                if(profileDiv) profileDiv.classList.add('hidden');
            }
        }

        function openChat() { alert('Live chat feature coming soon!'); }
    </script>
</body>
</html>
