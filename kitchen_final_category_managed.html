<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kitchen Display System - Hameeds Bistro</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS Library CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col justify-between">

    <!-- হেডার সেকশন -->
    <header class="bg-blue-900 text-white p-4 shadow-md flex justify-between items-center">
        <div class="flex items-center gap-3">
            <img src="images/logo.png" alt="Logo" class="h-12 w-12 rounded-full border-2 border-yellow-400 object-cover">
            <h1 class="text-xl font-bold uppercase tracking-wider">Kitchen Display System (KDS)</h1>
        </div>
        <div>
            <select id="kitchenFilter" onchange="fetchKitchenOrders()" class="bg-white text-blue-900 font-bold p-2 rounded shadow">
                <option value="">All Kitchen Sections</option>
            </select>
        </div>
    </header>

    <!-- মূল অর্ডার ডিসপ্লে কন্টেন্ট -->
    <main class="p-6 max-w-7xl mx-auto flex-grow w-full">
        <h2 class="text-2xl font-bold mb-6">Live Kitchen Orders</h2>
        
        <div id="ordersContainer" class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <!-- রিয়েল-টাইম অর্ডার কার্ডগুলো এখানে লোড হবে -->
        </div>
    </main>

    <!-- ফুটার সেকশন -->
    <footer class="bg-gray-900 text-gray-300 text-center py-4 border-t border-gray-800">
        <p class="text-sm font-medium tracking-wide">
            Copyright &copy; 2026 by রুদ্রাংশী (Rudranshi). All Rights Reserved.
        </p>
    </footer>

    <!-- স্ক্রিপ্ট লজিক -->
    <script>
        const SUPABASE_URL = 'https://tbvcaolnufayuvrqicpd.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRidmNhb2xudWZheXV2cnFpY3BkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYyMTI4MzYsImV4cCI6MjEwMTc4ODgzNn0.Cn2L569yd9qG8t1fXWN9rnwZ03Yott5P-doedUv1ItU';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let kitchenSections = [];
        let assignedCategoriesBySection = new Map();

        async function initKDS() {
            await fetchKitchenSections();
            await fetchKitchenOrders();

            // রিয়েল-টাইম সাবস্ক্রিপশন (নতুন অর্ডার আসলে অটো স্ক্রিনে দেখাবে)
            _supabase.channel('public:orders')
                .on('postgres_changes', { event: '*', schema: 'public', table: 'orders' }, () => {
                    fetchKitchenOrders();
                })
                .subscribe();
        }

        // কিচেন সেকশন লোড করা ড্রপডাউনের জন্য
        async function fetchKitchenSections() {
            const { data } = await _supabase.from('kitchen_sections').select('*');
            if (data) {
                kitchenSections = data;
                const select = document.getElementById('kitchenFilter');
                data.forEach(k => {
                    select.innerHTML += `<option value="${k.id}">${k.section_name}</option>`;
                });
            }
        }

        async function fetchAssignedCategories(sectionId) {
            if (!sectionId) return null;
            const { data, error } = await _supabase
                .from('kitchen_section_categories')
                .select('category')
                .eq('kitchen_section_id', sectionId);
            if (error) {
                console.error('Kitchen category mapping error:', error);
                return null;
            }
            return new Set((data || []).map(x => String(x.category || '').trim()).filter(Boolean));
        }

        // কিচেনের অর্ডার ফেচ করা
        async function fetchKitchenOrders() {
            const selectedKitchen = document.getElementById('kitchenFilter').value;
            let assignedCategories = null;

            if (selectedKitchen) {
                assignedCategories = await fetchAssignedCategories(selectedKitchen);
                // A configured kitchen section with no checked categories shows no menu items.
                if (assignedCategories && assignedCategories.size === 0) {
                    document.getElementById('ordersContainer').innerHTML = `<p class="text-gray-500 col-span-3 text-center py-10">এই Kitchen Section-এর জন্য কোনো Category assign করা হয়নি।</p>`;
                    return;
                }
            }

            let query = _supabase.from('orders')
                .select(`
                    id, table_id, section, status, created_at,
                    order_items (
                        quantity,
                        menu_items ( name_en, category, kitchen_section_id )
                    )
                `)
                .in('status', ['pending', 'preparing'])
                .order('created_at', { ascending: true });

            const { data: orders, error } = await query;
            const container = document.getElementById('ordersContainer');
            container.innerHTML = '';

            if (error || !orders || orders.length === 0) {
                container.innerHTML = `<p class="text-gray-500 col-span-3 text-center py-10">কোনো নতুন অর্ডার নেই।</p>`;
                return;
            }

            orders.forEach(order => {
                let filteredItems = order.order_items.filter(item => {
                    if (!item.menu_items) return false;
                    if (!selectedKitchen) return true;

                    // Category assignment made in Admin > Kitchen Display Management
                    // is the primary display rule.
                    if (assignedCategories) {
                        return assignedCategories.has(String(item.menu_items.category || '').trim());
                    }

                    // Backward-compatible fallback if the mapping table cannot be read.
                    return item.menu_items.kitchen_section_id == selectedKitchen;
                });

                if (filteredItems.length === 0) return;

                let itemsHtml = filteredItems.map(i => `
                    <li class="flex justify-between border-b py-1">
                        <span>${i.menu_items ? i.menu_items.name_en : 'Item'}</span>
                        <span class="font-bold text-red-600">x${i.quantity}</span>
                    </li>
                `).join('');

                container.innerHTML += `
                    <div class="bg-white border rounded shadow p-4 flex flex-col justify-between">
                        <div>
                            <div class="flex justify-between items-center mb-3 border-b pb-2">
                                <span class="bg-blue-100 text-blue-800 font-bold px-2 py-1 rounded text-sm">Table: ${order.table_id}</span>
                                <span class="text-xs text-gray-500">${new Date(order.created_at).toLocaleTimeString()}</span>
                            </div>
                            <ul class="mb-4 space-y-1">
                                ${itemsHtml}
                            </ul>
                        </div>
                        <button onclick="updateOrderStatus(${order.id}, 'ready')" class="bg-green-600 text-white w-full py-2 rounded font-bold hover:bg-green-700">
                            Mark as Ready
                        </button>
                    </div>
                `;
            });

            if (!container.innerHTML.trim()) {
                container.innerHTML = `<p class="text-gray-500 col-span-3 text-center py-10">এই Kitchen Section-এর assigned Category-তে কোনো নতুন item নেই।</p>`;
            }
        }

        // অর্ডার স্ট্যাটাস আপডেট করা (Ready করা)
        async function updateOrderStatus(orderId, status) {
            const { error } = await _supabase.from('orders').update({ status: status }).eq('id', orderId);
            if (error) {
                alert('স্ট্যাটাস আপডেট করতে সমস্যা হয়েছে!');
            } else {
                fetchKitchenOrders();
            }
        }

        initKDS();
    </script>
</body>
</html>
